# Builds Notch on Windows.
#
# - Every push and pull request: a Release build, to catch compile errors early.
# - A pushed version tag (v1.2.3): also publishes both zips to a GitHub release.
#
# To release:  git tag v0.3.0 && git push origin v0.3.0

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # WPF only builds on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Notch.csproj -c Release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write # to create the release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish both builds
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append

          # Runs anywhere: .NET is bundled into the exe.
          dotnet publish Notch.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none `
            -p:Version=$version -o publish/portable

          # Small: needs the .NET 10 Desktop Runtime installed.
          dotnet publish Notch.csproj -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true -p:DebugType=none `
            -p:Version=$version -o publish/runtime

          Compress-Archive publish/portable/Notch.exe "Notch-$version-win-x64-portable.zip"
          Compress-Archive publish/runtime/Notch.exe "Notch-$version-win-x64-requires-dotnet10.zip"

          Get-FileHash Notch-*.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content checksums.txt

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $checksums = Get-Content checksums.txt -Raw
          $notes = @"
          ## Download

          | File | Needs |
          | --- | --- |
          | **Notch-$env:VERSION-win-x64-portable.zip** | Nothing. Recommended. |
          | Notch-$env:VERSION-win-x64-requires-dotnet10.zip | The [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download) |

          Unzip and run ``Notch.exe``. Windows 10 (2004 or later) or Windows 11, 64-bit.

          > Windows SmartScreen may warn you the first time, because the exe isn't code-signed. Click **More info → Run anyway**.

          ## Checksums (SHA-256)

          ``````
          $checksums
          ``````
          "@

          gh release create "${{ github.ref_name }}" Notch-*.zip `
            --title "Notch $env:VERSION" --notes $notes --verify-tag
